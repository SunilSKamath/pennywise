services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pennywise
      MYSQL_USER: pennywise
      MYSQL_PASSWORD: pennywise
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppennywise"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "mysql://pennywise:pennywise@tcp(mysql:3306)/pennywise?multiStatements=true",
        "up"
      ]

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_DSN: pennywise:pennywise@tcp(mysql:3306)/pennywise?parseTime=true&multiStatements=true
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"

volumes:
  mysql-data:

