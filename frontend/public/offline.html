<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8B5CF6" />
    <title>Pennywise Offline</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f7f3ec;
        color: #1f2522;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 420px;
        border: 1px solid #e7ded2;
        border-radius: 16px;
        background: white;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(31, 37, 34, 0.08);
      }
      .icon {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        background: #8B5CF6;
        color: white;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 24px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #6d6760;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">P</div>
      <h1>Offline</h1>
      <p>Pennywise is installed, but it needs a connection to sync household data and sign in.</p>
    </main>
  </body>
</html>
